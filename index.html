<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>



    <header>
        <h1>Bookstore & Reading Club</h1>
         <p>Your community place for discovering books</p>
    </header>
   
    <main>

        <section class="hero">
            <h2>Welcome to Our Bookstore</h2>
            <p>join our reading club</p>

        </section>


        <section class="categories">
            <!-- card1 -->
            
            <div class="book-card">
                <h3>
                    Fiction books
                </h3>
                 <img src="images/fiction.png" alt="">
                <p>
                    Enjoy novels ,stories .
                </p>

               
            </div>


            <!-- card2 -->
            <div class="book-card">
                <h3>
                    Non-Fiction books
                </h3>
                <img src="images/non-fiction.png" alt="">
                <p>
                   Learn through educational and informative books
                </p>

            </div>


            

        </section>



    </main>

    <footer>
            <p>2026 bookstore club</p>

    </footer>






<script src="app.js"></script>


</body>
</html>
