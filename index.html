<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>



    <header>
        <h1>Bookstore & Reading Club</h1>
         <p>Your community place for discovering books</p>
    </header>
   
    <main>
       <!-- HERO SECTION -->
        <section class="hero">
            <h2>Welcome to Our Bookstore</h2>
            <p>join our reading club</p>

        </section>

        <!-- FORM -->

        <section>

            <form action=""> 

                <label for="userName">Username</label>
                <input type="text" name="" id="userName">

                <label for="Membership">Membership Type</label>
                <input type="text" name="" id="Membership">
              
                
                <label for="genre">Book Genre</label>
                <input type="text" name="" id="genre">
                
                <label for="bookTitle">Book Title</label>
                <input type="text" name="" id="bookTitle">
              
                <button type="submit" id="submitBtn"> </button>

            </form>

            <!-- Result-card -->
             <div id="result-card"> </div>


        </section>

        <!-- CARDS -->
        <section class="categories">
            <!-- card1 -->
            
            <div class="book-card">
                <h3>
                    Fiction books
                </h3>
                 <img src="images/fiction.png" alt="">
                <p>
                    Enjoy novels ,stories .
                </p>

               
            </div>


            <!-- card2 -->
            <div class="book-card">
                <h3>
                    Non-Fiction books
                </h3>
                <img src="images/non-fiction.png" alt="">
                <p>
                   Learn through educational and informative books
                </p>

            </div>


            

        </section>



    </main>

    <footer>
            <p>2026 bookstore club</p>

    </footer>






<script src="app.js"></script>


</body>
</html>
