<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Score Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: blue;
        }

        h2 {
            color: blue;
        }

        label {
            display: inline-block;
            width: 50px;
        }

        input {
            margin-bottom: 8px;
        }

        button {
            margin-right: 10px;
        }

        table {
            margin-top: 10px;
            border-collapse: collapse;
        }

        th, td {
            padding: 5px 30px 5px 0;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>Use a Test Score array</h1>

    <label for="name">Name:</label>
    <input type="text" id="name">
    <br>

    <label for="score">Score:</label>
    <input type="text" id="score">
    <br>

    <button id="add">Add to Array</button>
    <button id="display_results">Display Results</button>
    <button id="display_scores">Display Scores</button>

    <div id="results"></div>

    <table id="scores_table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="app.js"></script>

</body>
</html>
